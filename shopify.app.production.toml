# Public App Store configuration for TrendyBridgeOMS Hook Connector

client_id = "fcdab92947a7f2e3e22a2e97c7776744"
name = "TrendyBridgeOMS Hook Connector"
application_url = "https://oms-hook-connector-production.up.railway.app"
embedded = true

[access_scopes]
scopes = "read_orders"
optional_scopes = []
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://oms-hook-connector-production.up.railway.app/auth/callback"
]

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = ["orders/create"]
uri = "/webhooks/orders/create"

[[webhooks.subscriptions]]
topics = [
  "orders/fulfilled",
  "orders/partially_fulfilled",
  "orders/updated"
]
uri = "/webhooks/orders/fulfillment"
include_fields = [
  "id",
  "fulfillment_status",
  "updated_at",
  "fulfillments.id",
  "fulfillments.status",
  "fulfillments.created_at",
  "fulfillments.updated_at"
]

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/app/uninstalled"

[[webhooks.subscriptions]]
topics = ["app/scopes_update"]
uri = "/webhooks/app/scopes_update"

[[webhooks.subscriptions]]
compliance_topics = [
  "customers/data_request",
  "customers/redact",
  "shop/redact"
]
uri = "/webhooks/compliance"

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = false
